apiVersion: v1
kind: Secret
metadata:
  name: novacommerce-secrets
  namespace: novacommerce
type: Opaque
stringData:
  SECRET_KEY: "replace-me"
  JWT_SIGNING_KEY: "replace-me"
  DATABASE_URL: "postgresql://novacommerce:CHANGE_ME@postgres:5432/novacommerce"
  REDIS_URL: "redis://redis:6379/0"
  REDIS_CACHE_URL: "redis://redis:6379/1"
  REDIS_CHANNELS_URL: "redis://redis:6379/2"
  STRIPE_API_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  PAYPAL_CLIENT_ID: ""
  PAYPAL_CLIENT_SECRET: ""
  CLICK_SECRET_KEY: ""
  PAYME_SECRET_KEY: ""
  SENTRY_DSN: ""
