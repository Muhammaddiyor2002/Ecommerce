# =============================================================
# NovaCommerce Core — production nginx config
# Routes:
#   /api/v1/*       -> FastAPI (high-speed public)
#   /admin/*        -> Django
#   /api/admin/*    -> Django REST (admin/internal)
#   /ws/*           -> Django Channels (WebSockets)
#   /static/*       -> Django collected statics
#   /media/*        -> Media (or proxy to S3/CDN in prod)
# =============================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;
    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Rate limiting zones
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=200r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Upstreams
    upstream django_upstream {
        least_conn;
        keepalive 64;
        server django:8000;
    }

    upstream fastapi_upstream {
        least_conn;
        keepalive 256;
        server fastapi:8001;
    }

    # Real-IP / forwarded headers
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        ~.+     $http_x_forwarded_proto;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options           "SAMEORIGIN"           always;
        add_header X-Content-Type-Options    "nosniff"              always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "1; mode=block"        always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---------- WebSockets (Django Channels) ----------
        location /ws/ {
            proxy_pass http://django_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- Auth endpoints rate-limited ----------
        location ~* ^/api/(v1/auth/(login|register)|admin/auth) {
            limit_req zone=login burst=20 nodelay;
            limit_conn conn 50;
            proxy_pass http://django_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # ---------- High-speed public APIs (FastAPI) ----------
        location /api/v1/ {
            limit_req zone=api burst=400 nodelay;
            limit_conn conn 200;
            proxy_pass http://fastapi_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # ---------- Django REST + admin ----------
        location ~* ^/(api/admin|admin|accounts) {
            proxy_pass http://django_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # ---------- Static / media ----------
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location /media/ {
            alias /var/www/media/;
            expires 7d;
            access_log off;
        }

        # ---------- Health ----------
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Default -> Django (admin index)
        location / {
            proxy_pass http://django_upstream;
            include /etc/nginx/proxy_common.conf;
        }
    }
}
