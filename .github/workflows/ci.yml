name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Run mypy
        run: mypy django_app fastapi_app || true   # advisory until typed fully

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 2s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: novacommerce.settings.test
      SECRET_KEY: ci-secret
      JWT_SIGNING_KEY: ci-jwt
      DATABASE_URL: "sqlite:///test.sqlite3"
      REDIS_URL: "redis://localhost:6379/0"
      REDIS_CACHE_URL: "redis://localhost:6379/1"
      REDIS_CHANNELS_URL: "redis://localhost:6379/2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Run pytest
        run: pytest -ra --maxfail=5 --cov --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push Django image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.django
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/novacommerce-django:latest
            ghcr.io/${{ github.repository_owner }}/novacommerce-django:${{ github.sha }}
      - name: Build & push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.fastapi
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/novacommerce-fastapi:latest
            ghcr.io/${{ github.repository_owner }}/novacommerce-fastapi:${{ github.sha }}
